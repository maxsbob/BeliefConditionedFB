defaults:
  - agent: bfb
  - _self_

seed: 0
family: pointmass                # pointmass | inertial; diagnostic tasks, not MuJoCo replicas
num_train_contexts: 16
episodes: 256
episode_length: 64
context_len: 64
encoder_steps: 8000
encoder_batch_size: 128
embedding_bank_size: 256
fb_steps: 100000
batch_size: 256
chunk: 1000
eval_interval: 25000
eval_contexts: 8
eval_seed: 20261103
out_dir: runs/continuous/${family}/${agent.name}/seed${seed}

agent:
  obs_encoding: xy
  z_dim: 32
  h_dim: 32
  f_hidden_dims: [256, 256]
  f_embed_dim: 128
  b_hidden_dims: [128, 128]
  actor_hidden_dims: [256, 256]
  actor_lr: 3e-4
  actor_noise: 0.1
  target_agg: min                 # continuous twin-target aggregation
  action_penalty: 0.001
  belief_kappa: null              # isolate the paper's vMF prior from v2 belief perturbation
  discount: 0.95
  encoder:
    emb_dim: 64
    num_layers: 2
    num_heads: 4
    mlp_dim: 128
    predictor_hidden_dims: [128, 128]
    lr: 3e-4
    objective: delta
    delta_scale: 0.1
    num_queries: 32

hydra:
  run:
    dir: ${out_dir}
  job:
    chdir: false
